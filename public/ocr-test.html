<!doctype html>
<!-- 카메라 한자 인식 실측용 임시 페이지 (2026-09-23). 앱이 아니라 독립 문서다.
     재는 것 셋 — 폰에서의 속도 · 진짜 사진에서의 인식률 · 사전 조회까지 이어지는가.
     결론이 나면 지운다. 앱 어디서도 링크하지 않는다 (주소로만 들어온다). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yomenai — 카메라 인식 시험</title>
<style>
  :root { color-scheme: dark; --bg:#141210; --surface:#1d1a17; --surface-2:#262220;
          --border:#35302c; --text:#eeeae6; --dim:#a8a29b; --faint:#756f68; --ng:#e8563c; --ok:#4fa295; }
  * { box-sizing: border-box }
  /* 클래스의 display 가 UA 의 [hidden] 을 이긴다 — 카메라를 켜기 전에 촬영 버튼이
     떠 있었다 (2026-09-23 실측). 숨김은 무조건 이기게 둔다 */
  [hidden] { display: none !important }
  body { margin:0; padding:14px; background:var(--bg); color:var(--text);
         font:15px/1.55 system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  h1 { font-size:16px; margin:0 0 4px }
  .sub { color:var(--faint); font-size:12px; margin:0 0 14px }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
          padding:12px; margin-bottom:12px }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  button { min-height:46px; padding:10px 16px; border-radius:10px; border:1px solid var(--border);
           background:var(--surface-2); color:var(--text); font-size:15px }
  button.primary { background:#3c6f66; border-color:#3c6f66 }
  button[aria-pressed="true"] { background:#3c6f66; border-color:#3c6f66 }
  label.file { display:inline-flex; align-items:center; min-height:46px; padding:10px 16px;
               border-radius:10px; border:1px solid var(--border); background:var(--surface-2) }
  label.file input { display:none }
  .stage { position:relative; width:100%; background:#000; border-radius:10px; overflow:hidden }
  video, #shot { display:block; width:100% }
  #frame { position:absolute; left:12%; top:38%; width:76%; height:20%;
           border:2px solid var(--ok); border-radius:6px; box-shadow:0 0 0 9999px rgba(0,0,0,.35) }
  .hint { font-size:12px; color:var(--faint); margin:8px 0 0 }
  .big { font-size:30px; letter-spacing:.04em; margin:6px 0;
         font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif }
  .k { color:var(--dim); font-size:12px }
  .v { font-variant-numeric:tabular-nums }
  .hit { color:var(--ok) } .miss { color:var(--ng) }
  #log { font:12px/1.5 ui-monospace,monospace; color:var(--faint); white-space:pre-wrap;
         max-height:150px; overflow:auto }
  table { width:100%; border-collapse:collapse; font-size:13px }
  td { padding:4px 0; vertical-align:top } td:first-child { color:var(--dim); width:6.5em }
</style>
</head>
<body>
<h1>카메라 한자 인식 시험</h1>
<p class="sub">앱이 아니라 시험용 페이지다. 결론이 나면 지운다.</p>

<div class="card">
  <div class="row">
    <span class="k">글 방향</span>
    <button id="mHor" aria-pressed="true">가로쓰기</button>
    <button id="mVer" aria-pressed="false">세로쓰기</button>
  </div>
  <p class="hint">방향이 틀리면 결과가 통째로 무너진다 (실측 0/12). 소설은 대개 세로쓰기다.</p>
</div>

<div class="card">
  <div class="row">
    <button id="start" class="primary">카메라 켜기</button>
    <label class="file">사진 고르기
      <input id="file" type="file" accept="image/*" capture="environment">
    </label>
  </div>
  <div class="stage" id="stage" hidden>
    <video id="cam" playsinline muted autoplay></video>
    <div id="frame"></div>
  </div>
  <div class="row" id="shootRow" hidden style="margin-top:10px">
    <button id="shoot" class="primary">네모 안을 읽기</button>
    <button id="shootAll">화면 전체 읽기</button>
  </div>
  <p class="hint" id="camHint" hidden>초록 네모에 단어를 맞추고 누른다. 네모 안만 잘라서 읽는다.</p>
</div>

<div class="card">
  <img id="shot" alt="" hidden>
  <p class="big" id="out">—</p>
  <table>
    <tr><td>인식 시간</td><td class="v" id="tOcr">—</td></tr>
    <tr><td>모델 준비</td><td class="v" id="tInit">—</td></tr>
    <tr><td>사전 조회</td><td id="dict">—</td></tr>
  </table>
</div>

<div class="card"><div id="log"></div></div>

<script type="module">
// ESM 번들은 **기본 내보내기 하나**다. `{ createWorker }` 로 꺼내면
// "does not provide an export named 'createWorker'" 로 죽는다 (2026-09-23 실측)
import Tesseract from "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.esm.min.js"
const { createWorker } = Tesseract

const $ = (id) => document.getElementById(id)
const log = (s) => { $("log").textContent += s + "\n"; $("log").scrollTop = 1e6 }
const norm = (s) => (s || "").replace(/[\s　]/g, "")

const CDN = "https://cdn.jsdelivr.net/npm"
const OPTS = {
  langPath: "https://tessdata.projectnaptha.com/4.0.0_fast",
  workerPath: CDN + "/tesseract.js@5.1.1/dist/worker.min.js",
  corePath: CDN + "/tesseract.js-core@5",
  logger: () => {},
}

let vertical = false
$("mHor").onclick = () => setDir(false)
$("mVer").onclick = () => setDir(true)
function setDir(v) {
  vertical = v
  $("mHor").setAttribute("aria-pressed", String(!v))
  $("mVer").setAttribute("aria-pressed", String(v))
  log("글 방향 → " + (v ? "세로(jpn_vert)" : "가로(jpn)"))
}

/** 방향별로 따로 만들어 두고 재사용한다. 만드는 값이 비싸다 (모델 내려받기) */
const workers = {}
async function getWorker() {
  const lang = vertical ? "jpn_vert" : "jpn"
  if (workers[lang]) return workers[lang]
  const t0 = performance.now()
  log(lang + " 모델 준비 중…")
  const w = await createWorker(lang, 1, OPTS)
  // PSM 7 = 한 줄, 5 = 세로 한 블록. 실측에서 이 조합이 제일 나았다
  await w.setParameters({ tessedit_pageseg_mode: vertical ? "5" : "7" })
  const ms = Math.round(performance.now() - t0)
  $("tInit").textContent = lang + " " + ms + "ms"
  log(lang + " 준비 완료 " + ms + "ms")
  workers[lang] = w
  return w
}

let stream = null
$("start").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } },
      audio: false,
    })
    $("cam").srcObject = stream
    $("stage").hidden = false
    $("shootRow").hidden = false
    $("camHint").hidden = false
    $("start").textContent = "카메라 다시 켜기"
    const t = stream.getVideoTracks()[0].getSettings()
    log("카메라 " + t.width + "×" + t.height)
  } catch (e) {
    log("카메라 실패: " + e.name + " — " + e.message)
    log("(HTTPS 가 아니거나 권한을 거부했을 때 난다. 아래 「사진 고르기」로도 잴 수 있다)")
  }
}

/** 네모 안만 잘라 캔버스로. 자르기가 인식률을 가장 크게 바꾼다 */
function grab(cropToFrame) {
  const v = $("cam")
  const W = v.videoWidth, H = v.videoHeight
  const c = document.createElement("canvas")
  const ctx = c.getContext("2d")
  if (cropToFrame) {
    const x = W * 0.12, y = H * 0.38, w = W * 0.76, h = H * 0.2
    c.width = w; c.height = h
    ctx.drawImage(v, x, y, w, h, 0, 0, w, h)
  } else {
    c.width = W; c.height = H
    ctx.drawImage(v, 0, 0)
  }
  return c
}

async function run(src, label) {
  $("out").textContent = "읽는 중…"
  $("dict").textContent = "—"
  const w = await getWorker()
  const t0 = performance.now()
  const { data } = await w.recognize(src)
  const ms = Math.round(performance.now() - t0)
  const text = norm(data.text)
  $("tOcr").textContent = ms + "ms"
  $("out").textContent = text || "(빈칸)"
  log(label + ": " + ms + "ms · " + (text.slice(0, 60) || "(빈칸)"))
  lookup(text)
}

$("shoot").onclick = async () => {
  const c = grab(true)
  $("shot").src = c.toDataURL("image/png"); $("shot").hidden = false
  await run(c, "네모")
}
$("shootAll").onclick = async () => {
  const c = grab(false)
  $("shot").src = c.toDataURL("image/jpeg", 0.8); $("shot").hidden = false
  await run(c, "전체")
}
$("file").onchange = async (e) => {
  const f = e.target.files[0]
  if (!f) return
  const url = URL.createObjectURL(f)
  $("shot").src = url; $("shot").hidden = false
  log("파일 " + (f.size / 1048576).toFixed(2) + "MB")
  await run(url, "파일")
}

/* ── 사전 조회 — 여기까지 이어져야 기능이다 ──────────────────────── */
let dict = null
async function loadDict() {
  if (dict) return dict
  const t0 = performance.now()
  log("사전 받는 중… (설치된 앱이 있으면 캐시에서 온다)")
  const res = await fetch("./dict/base.json")
  const data = await res.json()
  dict = new Map()
  for (const i of data.idioms) if (!dict.has(i.headword)) dict.set(i.headword, i)
  log("사전 " + dict.size + "개 " + Math.round(performance.now() - t0) + "ms")
  return dict
}

async function lookup(text) {
  if (!text) { $("dict").textContent = "읽은 글자가 없다"; return }
  const d = await loadDict()
  // 정확히 맞는 것부터 — 인식 결과 안의 어느 구간이든 사전에 있으면 잡는다
  for (let len = Math.min(6, text.length); len >= 2; len--) {
    for (let i = 0; i + len <= text.length; i++) {
      const hit = d.get(text.slice(i, i + len))
      if (hit) {
        const def = (hit.koMeaning && hit.koMeaning.definition) || ""
        $("dict").innerHTML =
          '<span class="hit">' + hit.headword + " " + hit.reading + "</span><br>" +
          '<span class="k">' + def.slice(0, 40) + "</span>"
        return
      }
    }
  }
  // 한 글자만 어긋난 경우 — 실측에서 오답이 대개 이 꼴이었다 (軍艦→軍朋)
  const near = []
  for (const head of d.keys()) {
    if (head.length !== text.length) continue
    let diff = 0
    for (let i = 0; i < head.length; i++) if (head[i] !== text[i]) diff++
    if (diff === 1) { near.push(head); if (near.length >= 5) break }
  }
  $("dict").innerHTML = near.length
    ? '<span class="miss">정확히 없음</span> <span class="k">· 한 글자 다른 후보: ' + near.join(" ") + "</span>"
    : '<span class="miss">사전에 없음</span>'
}
</script>
</body>
</html>
